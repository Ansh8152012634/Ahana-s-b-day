kind = "web"
previewPath = "/"
title = "Ahana's Birthday Experience"
version = "1.0.0"
id = "artifacts/ahana-birthday"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23359

[services.development]
run = "pnpm --filter @workspace/ahana-birthday run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ahana-birthday", "run", "build" ]
serve = "static"
publicDir = "artifacts/ahana-birthday/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23359"
BASE_PATH = "/"
